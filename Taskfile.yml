
# Taskfile to be used with task: https://taskfile.dev
#
# task itself is installed as a "dev" dependency of this plugin, so after a
# `uv sync` it is available as `go-task` (or `task`) inside the project venv:
#
#   uv sync
#   uv run go-task --list-all
#

version: "3"

env:
    LOCALES: []  # list your included locales here, e.g. ["de", "fr"]
    TRANSLATIONS: "octoprint_arc_welder/translations"  # translations folder


tasks:
    install:
        desc: Sync the project venv (runtime + dev dependencies)
        cmds:
          - uv sync

    ### Build related

    build:
        desc: Builds sdist & wheel
        cmds:
          - uv build

    build-sdist:
        desc: Builds sdist
        cmds:
          - uv build --sdist

    build-wheel:
        desc: Builds wheel
        cmds:
          - uv build --wheel

    ### Translation related

    babel-new:
        desc: Create a new translation for a locale
        cmds:
          - task: babel-extract
          - uv run pybabel init --input-file=translations/messages.pot --output-dir=translations --locale="{{ .CLI_ARGS }}"

    babel-extract:
        desc: Update pot file from source
        cmds:
          - uv run pybabel extract --mapping-file=babel.cfg --output-file=translations/messages.pot --msgid-bugs-address=i18n@octoprint.org --copyright-holder="The OctoPrint Project" .

    babel-update:
        desc: Update translation files from pot file
        cmds:
          - for:
                var: LOCALES
            cmd: uv run pybabel update --input-file=translations/messages.pot --output-dir=translations --locale={{ .ITEM }}

    babel-refresh:
        desc: Update translation files from source
        cmds:
          - task: babel-extract
          - task: babel-update

    babel-compile:
        desc: Compile translation files
        cmds:
          - uv run pybabel compile --directory=translations

    babel-bundle:
        desc: Bundle translations
        preconditions:
          - test -d {{ .TRANSLATIONS }}
        cmds:
          - for:
               var: LOCALES
            cmd: |
                locale="{{ .ITEM }}"
                source="translations/${locale}"
                target="{{ .TRANSLATIONS }}/${locale}"

                [ ! -d "${target}" ] || rm -r "${target}"

                echo "Copying translations for locale ${locale} from ${source} to ${target}..."
                cp -r "${source}" "${target}"
